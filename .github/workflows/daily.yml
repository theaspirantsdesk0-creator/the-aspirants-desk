
name: Daily content check and update

on:
  push:
    branches: [main]
    paths:
      - 'tools/desk.py'
      - 'tools/feeds.json'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: "0 14 * * *" # 19:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh current affairs and generate optional UPSC angles
        run: python tools/desk.py news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - run: python tools/desk.py validate

      - run: python tools/desk.py build

      - name: Commit if anything changed
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Daily content update" && git push)
