
name: Daily content check and update

on:
  push:
    branches: [main]
    paths:
      - 'tools/desk.py'
      - 'tools/feeds.json'
      - 'tools/publish_generated.py'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: "0 14 * * *" # 19:30 IST daily
  workflow_dispatch:

concurrency:
  group: daily-content-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start from latest main to avoid stale queued runs
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh current affairs and generate optional UPSC angles
        run: python tools/desk.py news
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: \${{ secrets.GROQ_API_KEY }}

      - name: Validate generated content and site
        run: python tools/desk.py validate

      - name: Build published question bank
        run: python tools/desk.py build

      - name: Publish with merge and push retries
        run: python tools/publish_generated.py data/current-affairs.json
