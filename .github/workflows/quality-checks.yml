name: Project quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python scripts
        run: python -m compileall -q scripts tools
      - name: Run project quality checks
        run: python tools/quality_check.py
      - name: Generate practice-bank audit report
        if: always()
        run: |
          mkdir -p build/reports
          python tools/question_bank_audit.py --output build/reports/question-bank-audit.json
          python tools/question_bank_audit.py
      - name: Upload practice-bank audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-bank-audit
          path: build/reports/question-bank-audit.json
          if-no-files-found: error
          retention-days: 30
