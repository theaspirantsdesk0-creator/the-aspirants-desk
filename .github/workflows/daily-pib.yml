
name: Daily PIB update
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_pib.py'
      - 'tools/publish_generated.py'
      - '.github/workflows/daily-pib.yml'
  schedule:
    - cron: "30 12 * * *" # 18:00 IST; GitHub may start a few minutes late
  workflow_dispatch:

concurrency:
  group: daily-content-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Start from latest main to avoid stale queued runs
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PIB feed dependencies
        run: pip install feedparser requests

      - name: Validate PIB updater syntax
        run: python -m py_compile scripts/update_pib.py tools/publish_generated.py

      - name: Fetch PIB and add optional AI explanations
        run: python scripts/update_pib.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: llama-3.3-70b-versatile

      - name: Publish with merge and push retries
        run: python tools/publish_generated.py data/pib.json

      - name: Upload the updated site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
