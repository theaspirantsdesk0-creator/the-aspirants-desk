name: Daily PIB update
on:
  schedule:
    - cron: "30 12 * * *"   # 12:30 UTC = 6:00 pm IST (GitHub may start a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser anthropic
      - run: python scripts/update_pib.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add data/pib.json
          git diff --cached --quiet || (git commit -m "Daily PIB update" && git push)
