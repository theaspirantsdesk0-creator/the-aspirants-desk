name: Daily PIB update
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_pib.py'
      - '.github/workflows/daily-pib.yml'
  schedule:
    - cron: "30 12 * * *" # 18:00 IST; GitHub may start a few minutes late
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PIB feed dependencies
        run: pip install feedparser requests
      - name: Validate PIB updater syntax
        run: python -m py_compile scripts/update_pib.py
      - name: Fetch PIB and add optional AI explanations
        run: python scripts/update_pib.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_MODEL: llama-3.3-70b-versatile
      - name: Save changes
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add data/pib.json
          git diff --cached --quiet || (git commit -m "Daily PIB update" && git push)
