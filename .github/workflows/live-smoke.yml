name: Live browser smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Allow Pages deployment to settle
        run: sleep 30
      - name: Test the published website
        run: node tools/live_smoke.mjs
        env:
          DESK_BASE_URL: https://theaspirantsdesk0-creator.github.io/the-aspirants-desk/
