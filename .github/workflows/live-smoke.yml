name: Live browser smoke test
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - "assets/**"
      - "tools/live_smoke.mjs"
      - ".github/workflows/live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Allow Pages deployment to finish
        run: sleep 90
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the published website
        run: node tools/live_smoke.mjs
        env:
          DESK_BASE_URL: https://theaspirantsdesk0-creator.github.io/the-aspirants-desk/
